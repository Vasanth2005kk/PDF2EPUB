[project]
name = "pdf2epub"
version = "1.0.0"
description = "Flask single-page application that converts PDF documents into EPUB 3 eBooks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ebooklib>=0.21",
    "flask>=3.1.3",
    "lxml>=6.1.3",
    "pillow>=13.0.0",
    "pymupdf>=2.0",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
production = [
    "gunicorn>=26.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Unicode punctuation is intentional (bullets, dashes, Tamil)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "ocr: requires Tesseract",
    "epubcheck: requires EPUBCheck (set EPUBCHECK_PATH)",
]
